name: dip-trader
# Mean-reversion "buy the dip" strategy. Runs ONCE near the close to make the day's buy/exit
# decision on end-of-day RSI(2). Holds 1-5 days (overnight ok). Replaces the momentum market-runner.
on:
  schedule:
    - cron: '35 13 * * 1-5'   # 9:35 AM ET - MORNING SAFETY run (verify positions + re-arm stops only)
    - cron: '25 19 * * 1-5'   # 3:25 PM ET Mon-Fri - DECISION run (entries/exits near the daily close).
    # NOTE: a 2nd "backup" decision cron was REMOVED 2026-07-30. On 07-28 it raced the primary run:
    # both fired at once, both saw 3 free slots, and 5 orders went in ($17,982 on $10,052 cash = margin).
    # One decision run only. The script also now re-checks live cash before every single buy.
  workflow_dispatch: {}
concurrency: { group: dip-trader-single, cancel-in-progress: true }   # never let two decision runs overlap
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Refresh earnings calendar (free, no API key)
        continue-on-error: true      # a stale/missing calendar must never block trading
        run: |
          pip install --quiet yfinance
          python earnings_calendar.py
      - name: Run dip-buyer
        shell: pwsh
        env:
          APCA_API_BASE_URL:   ${{ secrets.APCA_API_BASE_URL }}
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: pwsh ./dip_trader.ps1
